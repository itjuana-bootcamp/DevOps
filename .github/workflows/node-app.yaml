name: CI/CD Pipeline

on:
  push:
    branches:
      - test-best-practices

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
    
      - uses: actions/setup-node@v4
        with:
            node-version: 18

      - name: Install dependencies
        run: |
          npm install express
          npm install --save-dev jest supertest
        working-directory: my-express-app

      - name: Run tests
        run: npm test
        working-directory: my-express-app

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Heroku
        uses: akhileshns/heroku-deploy@v3.12.12
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: "gh-node-app"
          heroku_email: "alejandro.garcial@dexcom.com"
