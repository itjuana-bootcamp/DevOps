# Cada pull request, corra tests
# Si los tests pasan, se deployee a dev

name: CI/CD on Pull Request

on:
    pull_request:
        branches:
            - main

jobs:
    build_test_js_app:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                node-version: 20
            
            - name: Install dependencies
              run: | 
                npm install
              working-directory: swebp-node

            - name: Run tests
              run: | 
                npm test
              working-directory: swebp-node
            