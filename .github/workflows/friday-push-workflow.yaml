name: My Friday Push Workflow

on:
    workflow_dispatch:
    push:
        branches:
            - best-practices
            - main

jobs:
    build_test_js_app:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            
            - uses: actions/setup-node@v4
              with:
                node-version: 18
            
            - name: Install dependencies
              run: |
                npm install express
                npm install --save-dev jest supertest
              working-directory: my-express-app
            
            - name: Run tests
              run: |
                npm test
              working-directory: my-express-app
    
    deploy_js_app:
        needs: [build_test_js_app]
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            
            - name: Install Heroku CLI # <- IMPORTANT!!! Make sure the cli is installed before using the action
              run: |
                curl https://cli-assets.heroku.com/install.sh | sh
            
            - uses: akhileshns/heroku-deploy@v3.14.15 # This is the action
              with:
                heroku_api_key: ${{secrets.HEROKU_API_KEY}}
                heroku_app_name: "gh-node-app" #Must be unique in Heroku
                heroku_email: ${{vars.HEROKU_USERNAME}}
                appdir: "my-express-app"