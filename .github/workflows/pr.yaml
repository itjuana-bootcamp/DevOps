# 1. On every pull request, run tests
# 2. On tests passing, deploy to dev environment

name: CI/CD on Pull Request

on:
  pull_request:
    branches:
      - main

jobs:
  build_test_js_app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install
        working-directory: swebp-node

      - name: Run tests
        run: |
          npm test
        working-directory: swebp-node