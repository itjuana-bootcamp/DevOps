name: My Friday PR Workflow

on:
    pull_request:
        branches:
            - main

jobs:
    build_test_js_app:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            
            - uses: actions/setup-node@v4
              with:
                node-version: 18
            
            - name: Install dependencies
              run: |
                npm install express
                npm install --save-dev jest supertest
              working-directory: my-express-app
            
            - name: Run tests
              run: |
                npm test
              working-directory: my-express-app